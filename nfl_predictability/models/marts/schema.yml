version: 2

models:
  - name: mart_team_predictability
    description: "Share of plays where each team made the league-usual run/pass call for its down and distance (an earlier measure of how unusual a team is, not how guessable)."
    columns:
      - name: team
        data_tests:
          - not_null
      - name: predictability_score
        data_tests:
          - not_null

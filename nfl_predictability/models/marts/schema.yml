version: 2

models:
  - name: mart_team_predictability
    description: "Share of plays where each team made the league-expected run/pass call, by season."
    columns:
      - name: team
        data_tests:
          - not_null
      - name: predictability_score
        data_tests:
          - not_null

  - name: mart_team_season_summary
    description: "One row per team and season: pass rate, two predictability scores, and EPA on expected vs. unexpected calls."
    columns:
      - name: team
        data_tests:
          - not_null
      - name: season
        data_tests:
          - not_null
      - name: self_score
        data_tests:
          - not_null
